<!DOCTYPE html>
<html>

<head>
    <title>OTP Verification</title>
</head>

<body style="text-align:center; margin-top:100px;">

    <h2>Enter OTP</h2>

    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <br><br>
        <button type="submit">Verify</button>
    </form>

    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

</body>

</html>
