<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* 🔹 OTP BOX STYLE */
        .otp-container {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .otp-box {
            width: 40px;
            height: 45px;
            text-align: center;
            font-size: 18px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
        }

        .otp-box:focus {
            border-bottom: 2px solid #4facfe;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #00c6ff;
        }

        a {
            text-decoration: none;
            color: #4facfe;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login Details</h2>

        <form method="POST">
            {% if show_otp %}
            <input type="text" name="otp" placeholder="Enter OTP" required>
            {% else %}
            <input type="text" name="accnum" placeholder="Account Number" required>
            <input type="password" name="pin" placeholder="PIN" required>
            {% endif %}
            <button type="submit">Submit</button>
        </form>

        <br>
        <a href="/create">New user? Create Account</a>
    </div>

    <!-- 🔹 AUTO MOVE OTP CURSOR -->
    <script>
        const inputs = document.querySelectorAll(".otp-box");

        inputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && index > 0 && input.value === "") {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>

</body>

</html>
